<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KMA HSR 강수 유형 분류 및 유사 사례 검색</title>
<link rel="stylesheet" href="app/app.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1>KMA HSR 강수 유형 분류 및 유사 사례 검색</h1>
    <span id="modeBadge" class="mode"></span>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="search" class="on">검색</button>
    <button role="tab" data-tab="stats">분류 통계</button>
    <button role="tab" data-tab="about">안내</button>
  </nav>
</header>
<div id="demoBanner" class="banner" hidden></div>

<section id="tab-search" class="tab">
  <div class="toolbar">
    <label class="f">날짜 <input type="date" id="fDate"></label>
    <form id="fTimeForm" class="f"><label>시각·frame_id <input type="text" id="fTime" placeholder="YYYYMMDDHHMM" inputmode="numeric" maxlength="16" size="13"></label><button type="submit">찾기</button></form>
    <label class="f">DINOv3 <select id="fD1"><option value="">전체</option><option value="0">LINEAR</option><option value="1">TY</option></select></label>
    <label class="f">M0 <select id="fM0"><option value="">전체</option><option value="0">LINEAR</option><option value="1">TY</option></select></label>
    <label class="f">두 모델 <select id="fAg"><option value="">전체</option><option value="1">일치</option><option value="0">불일치</option></select></label>
    <label class="f">계절 <select id="fSea"><option value="">전체</option><option value="warm">6–10월</option><option value="cold">11–5월</option></select></label>
    <label class="f">강에코 면적 <select id="fA40"><option value="">전체</option></select></label>
    <span class="f grp" id="grpBtns"></span>
    <button id="fReset" class="ghost" type="button">초기화</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div id="msg" class="msg" hidden></div>
  <div class="work">
    <aside class="list">
      <div class="listhead"><button id="prev" type="button" title="이전 프레임 (←)">◀ 이전</button><span id="pos"></span><button id="next" type="button" title="다음 프레임 (→)">다음 ▶</button></div>
      <div id="vlist" class="vlist" tabindex="0" aria-label="검색 결과 목록"><div id="vspace"></div></div>
    </aside>
    <main class="main">
      <div class="qrow">
        <figure class="qimg"><img id="qImg" alt="현재 프레임 레이더 영상"><figcaption id="qCap"></figcaption><div id="qMiss" class="miss" hidden>영상을 불러올 수 없습니다</div></figure>
        <div class="info" id="info"></div>
      </div>
      <div class="t5">
        <div class="t5head"><b>GOLDEN 유사 사례 Top-5</b><span class="sub">PHASE9 R3_BALANCED · 사후(retrospective) 검색 · 예측 범주로 필터링하지 않음 · 카드를 누르면 두 영상 비교</span></div>
        <div class="cards" id="cards"></div>
      </div>
    </main>
  </div>
</section>

<section id="tab-stats" class="tab" hidden><div class="statwrap" id="stats"></div></section>
<section id="tab-about" class="tab" hidden><div class="statwrap" id="about"></div></section>

<div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="mbox">
    <div class="mhead"><b id="mTitle"></b><span class="sp"></span><button id="mPrev" type="button">◀</button><button id="mNext" type="button">▶</button><button id="mClose" type="button" aria-label="닫기">✕ 닫기</button></div>
    <div class="mbody" id="mBody"></div>
  </div>
</div>

<script src="data/index.js"></script>
<script src="data/golden.js"></script>
<script src="data/stats.js"></script>
<script src="app/app.js"></script>
</body>
</html>
