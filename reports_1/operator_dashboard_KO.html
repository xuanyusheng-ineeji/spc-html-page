<title>작업자 작업 성과 분석 · Operator Performance</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EEF1F8;--surface:#fff;--border:#D2D9E8;
  --t1:#1A2035;--t2:#5A6685;--t3:#9BA8BE;
  --a:#2E60DC;--p:#1A9E6C;--w:#C8870A;--f:#D43B3B;
  --r:6px;
}
body{background:var(--bg);color:var(--t1);font-family:system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
#app{max-width:1200px;margin:0 auto;padding:0 20px 48px}
header{padding:22px 0 14px;border-bottom:1px solid var(--border);margin-bottom:18px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
header p{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:3px;letter-spacing:.04em;background:#EBF2FF;color:#2E60DC}
.badge.wrk{background:#E8F5F0;color:#1A7A58}
.src-badges{display:flex;gap:6px}

/* KPI row */
#kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,var(--a))}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:6px;font-weight:600}
.kpi-value{font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px;font-variant-numeric:tabular-nums}

/* operator list */
#op-list{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:18px}
.op-btn{display:flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;transition:all .12s;color:var(--t2);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.op-btn:hover{border-color:var(--a);color:var(--a)}
.op-btn.active{background:var(--a);border-color:var(--a);color:#fff}
.op-btn.active .opbadge{background:rgba(255,255,255,.22);color:#fff}
.opbadge{font-size:10px;font-weight:600;padding:2px 5px;border-radius:2px;font-variant-numeric:tabular-nums}
.opbadge.good{background:#D6F5E8;color:#16854E}
.opbadge.warn{background:#FEF3C7;color:#A16207}
.opbadge.fail{background:#FEE2E2;color:#B91C1C}

/* 3-column chart layout */
.chart-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.chart-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px 10px}
.chart-card.full{grid-column:1/-1}
.chart-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.chart-title{font-size:13px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.chart-src{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:2px}
.chart-src.wrk{background:#E8F5F0;color:#1A7A58}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2)}
.ll{width:18px;height:2px;border-radius:1px;display:inline-block}
canvas{display:block;width:100%;cursor:crosshair}
.cv-rank{height:340px}
.cv-scatter{height:260px}
.cv-heat{height:280px}
.cv-dist{height:220px}

/* highlight row & tooltip */
#tip{position:fixed;display:none;background:#1A2035;color:#E6ECF8;border-radius:5px;padding:10px 13px;font-size:12px;pointer-events:none;z-index:9999;box-shadow:0 4px 18px rgba(0,0,0,.28);min-width:145px}
.tip-date{font-weight:600;margin-bottom:6px;color:#8FA0C0;font-size:10px;letter-spacing:.07em;text-transform:uppercase}
.tip-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:2px 0}
.tip-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.tip-div{border-top:1px solid rgba(255,255,255,.1);margin:5px 0}
.stat-label{font-weight:600;color:var(--t3);font-size:11px;margin-bottom:2px}
.stat-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}

@media(max-width:800px){
  .chart-grid-3{grid-template-columns:1fr}
  .chart-grid-2{grid-template-columns:1fr}
  #kpis{grid-template-columns:repeat(2,1fr)}
  .kpi-value{font-size:22px}
}
</style>

<div id="app">
  <header>
    <div>
      <h1>작업자 작업 성과 분석</h1>
      <p>Operator Performance · Weight QC · 1,050 orders · 21 operators</p>
    </div>
    <div class="src-badges">
      <span class="badge">RAWDATA</span>
      <span class="badge wrk">WORKER</span>
    </div>
  </header>

  <section id="kpis">
    <div class="kpi" style="--kc:#1A9E6C">
      <div class="kpi-label">최고 합격률</div>
      <div class="kpi-value" id="kv-best">—</div>
      <div class="kpi-sub" id="ks-best">&nbsp;</div>
    </div>
    <div class="kpi" style="--kc:#D43B3B">
      <div class="kpi-label">최저 합격률</div>
      <div class="kpi-value" id="kv-worst">—</div>
      <div class="kpi-sub" id="ks-worst">&nbsp;</div>
    </div>
    <div class="kpi" style="--kc:#2E60DC">
      <div class="kpi-label">가장 안정적인 작업자</div>
      <div class="kpi-value" id="kv-stable">—</div>
      <div class="kpi-sub" id="ks-stable">합격률 표준편차 최소</div>
    </div>
    <div class="kpi" style="--kc:#C8870A">
      <div class="kpi-label">최다 주문 건수</div>
      <div class="kpi-value" id="kv-busy">—</div>
      <div class="kpi-sub" id="ks-busy">&nbsp;</div>
    </div>
  </section>

  <div id="op-list"></div>

  <!-- Row 1: Ranking bar + scatter -->
  <div class="chart-grid-2" style="margin-bottom:12px">
    <div class="chart-card">
      <div class="chart-hdr">
        <span class="chart-title"><span class="chart-src wrk">WORKER</span>합격률 순위（평균 ± σ）</span>
        <div class="legend">
          <span class="li"><span class="ll" style="background:#1A9E6C"></span>평균</span>
          <span class="li" style="color:#9BA8BE">│ ±σ 구간</span>
        </div>
      </div>
      <canvas id="cvRank" class="cv-rank"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-hdr">
        <span class="chart-title"><span class="chart-src wrk">WORKER</span>품질 vs 작업효율（산점도）</span>
        <div class="legend">
          <span class="li" style="font-size:10px;color:#9BA8BE">버블 크기 = 주문 건수, 색상 = 합격률</span>
        </div>
      </div>
      <canvas id="cvScatter" class="cv-scatter"></canvas>
    </div>
  </div>

  <!-- Row 2: Heatmap full width -->
  <div class="chart-grid-2" style="margin-bottom:0">
    <div class="chart-card full">
      <div class="chart-hdr">
        <span class="chart-title"><span class="chart-src wrk">WORKER</span>작업자 × 제품 합격률 히트맵</span>
        <div class="legend">
          <span class="li"><span class="ll" style="background:#1A9E6C;width:14px;height:14px;border-radius:3px"></span>&gt;96%</span>
          <span class="li"><span class="ll" style="background:#C8870A;width:14px;height:14px;border-radius:3px"></span>90-96%</span>
          <span class="li"><span class="ll" style="background:#D43B3B;width:14px;height:14px;border-radius:3px"></span>&lt;90%</span>
          <span class="li"><span class="ll" style="background:#D2D9E8;width:14px;height:14px;border-radius:3px"></span>데이터 없음</span>
        </div>
      </div>
      <canvas id="cvHeat" class="cv-heat"></canvas>
    </div>
  </div>
</div>

<div id="tip"></div>

// ── palette ───────────────────────────────────────────────────────────────
const C={
  bg:'#EEF1F8',sur:'#fff',bd:'#D2D9E8',

  good:'#1A9E6C',warn:'#C8870A',fail:'#D43B3B'

function passColor(p){
  if(p>=96) return C.good;
  if(p>=90) return C.warn;
  return C.fail;
}

// ── Canvas helpers ─────────────────────────────────────────────────────────
function resize(cv){
  const dpr=window.devicePixelRatio||1;
  const rc=cv.getBoundingClientRect();
  cv.width=Math.round(rc.width*dpr);
  cv.height=Math.round(rc.height*dpr);
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
  return {ctx, w:rc.width, h:rc.height, dpr};
}

function grid(ctx,x0,y0,cw,ch,nx,ny){
  ctx.strokeStyle='rgba(210,217,232,0.5)';ctx.lineWidth=0.5;
  for(let i=0;i<=ny;i++){
    const y=y0+i*ch/ny;
    ctx.beginPath();ctx.moveTo(x0,y);ctx.lineTo(x0+cw,y);ctx.stroke();
  }
  for(let i=0;i<=nx;i++){
    const x=x0+i*cw/nx;
    ctx.beginPath();ctx.moveTo(x,y0);ctx.lineTo(x,y0+ch);ctx.stroke();
  }
}

// ── Rank chart ────────────────────────────────────────────────────────────
const cvRank = document.getElementById('cvRank');

function drawRank(){
  const {ctx,w,h}=resize(cvRank);
  const pad={t:12,r:20,b:24,l:52};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const barH=Math.min(20, ch/N - 4);
  const rowH=ch/N;

  const minPass=Math.min(...OPS.map(o=>o[1].avg_pass-o[1].std_pass));
  const maxPass=Math.min(100,Math.max(...OPS.map(o=>o[1].avg_pass+o[1].std_pass)));
  const lo=Math.max(85,minPass-1);
  const hi=Math.min(100,maxPass+0.5);
  function xAt(v){ return pad.l + (v-lo)/(hi-lo)*cw; }

  // grid lines + x labels
  ctx.font='10px system-ui';ctx.fillStyle=C.t3;ctx.textAlign='center';
  for(let v=86;v<=100;v+=2){
    const x=xAt(v);
    if(x<pad.l||x>pad.l+cw) continue;
    ctx.strokeStyle='rgba(210,217,232,0.5)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ch);ctx.stroke();
    ctx.fillText(v+'%',x,pad.t+ch+14);
  }

  OPS.forEach(([uid,s],i)=>{
    const cy=pad.t+i*rowH+rowH/2;
    const isHL=selOp===uid;

    // row highlight
    if(isHL){
      ctx.fillStyle='rgba(46,96,220,0.06)';
      ctx.fillRect(pad.l-4,pad.t+i*rowH,cw+8,rowH);
    }

    // σ whisker
    const x0=xAt(Math.max(lo,s.avg_pass-s.std_pass));
    const x1=xAt(Math.min(hi,s.avg_pass+s.std_pass));
    const xm=xAt(s.avg_pass);
    ctx.strokeStyle=isHL?'rgba(46,96,220,0.4)':'rgba(210,217,232,0.8)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x0,cy);ctx.lineTo(x1,cy);ctx.stroke();
    ctx.strokeStyle=ctx.strokeStyle;
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(x0,cy-5);ctx.lineTo(x0,cy+5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x1,cy-5);ctx.lineTo(x1,cy+5);ctx.stroke();

    // bar
    const bx=xAt(lo);
    const bw=Math.max(1,xm-bx);
    const by=cy-barH/2;
    ctx.fillStyle=passColor(s.avg_pass)+(isHL?'EE':'88');
    ctx.beginPath();ctx.roundRect(bx,by,bw,barH,2);ctx.fill();

    // dot at mean
    ctx.fillStyle=passColor(s.avg_pass);
    ctx.beginPath();ctx.arc(xm,cy,3.5,0,Math.PI*2);ctx.fill();

    // operator label
    ctx.font=isHL?'bold 10px system-ui':'10px system-ui';
    ctx.fillStyle=isHL?C.t1:C.t2;
    ctx.textAlign='right';
    ctx.fillText('#'+shortId(uid),pad.l-6,cy+3.5);

    // value label
    ctx.fillStyle=isHL?C.t1:C.t3;
    ctx.textAlign='left';
    ctx.font='10px system-ui';
    ctx.fillText(s.avg_pass.toFixed(1)+'%',xm+6,cy+3.5);
  });

  // axis line
  ctx.strokeStyle=C.bd;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,pad.t);ctx.lineTo(pad.l,pad.t+ch);ctx.stroke();
}

// ── Scatter chart ─────────────────────────────────────────────────────────
const cvScatter=document.getElementById('cvScatter');
let scatterHits=[];

function drawScatter(){
  const {ctx,w,h}=resize(cvScatter);
  const pad={t:16,r:24,b:36,l:54};
  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;

  const times=OPS.map(o=>o[1].avg_work_time).filter(v=>v>0);
  const passes=OPS.map(o=>o[1].avg_pass);
  const tMin=Math.min(...times)*0.9, tMax=Math.max(...times)*1.05;
  const pMin=Math.min(...passes)-1, pMax=Math.min(100,Math.max(...passes)+0.5);
  const maxOrders=Math.max(...OPS.map(o=>o[1].order_cnt));

  function xAt(t){ return pad.l+(t-tMin)/(tMax-tMin)*cw; }
  function yAt(p){ return pad.t+ch-(p-pMin)/(pMax-pMin)*ch; }

  // grid
  ctx.font='10px system-ui';ctx.fillStyle=C.t3;
  // y grid
  for(let p=86;p<=100;p+=2){
    const y=yAt(p);if(y<pad.t||y>pad.t+ch) continue;
    ctx.strokeStyle='rgba(210,217,232,0.5)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cw,y);ctx.stroke();
    ctx.textAlign='right';ctx.fillText(p+'%',pad.l-4,y+3.5);
  }
  // x ticks
  ctx.textAlign='center';
  const tStep=Math.round((tMax-tMin)/5/60)*60||60;
  for(let t=Math.ceil(tMin/60)*60;t<=tMax;t+=tStep){
    const x=xAt(t);if(x<pad.l||x>pad.l+cw) continue;
    ctx.strokeStyle='rgba(210,217,232,0.5)';ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ch);ctx.stroke();
    ctx.fillText(Math.round(t/60)+'h',x,pad.t+ch+14);
  }
  ctx.fillText('평균 작업시간',pad.l+cw/2,pad.t+ch+28);

  // axis labels
  ctx.save();ctx.translate(14,pad.t+ch/2);ctx.rotate(-Math.PI/2);
  ctx.textAlign='center';ctx.fillText('평균 합격률',0,0);ctx.restore();

  scatterHits=[];
  OPS.forEach(([uid,s])=>{
    if(!s.avg_work_time) return;
    const x=xAt(s.avg_work_time);
    const y=yAt(s.avg_pass);
    const r=4+Math.sqrt(s.order_cnt/maxOrders)*14;
    const isHL=selOp===uid;
    const col=passColor(s.avg_pass);

    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fillStyle=col+(isHL?'EE':'55');
    ctx.strokeStyle=col+(isHL?'':'88');
    ctx.lineWidth=isHL?2:1;
    ctx.fill();ctx.stroke();

    if(isHL||N<=12){
      ctx.font=isHL?'bold 10px system-ui':'10px system-ui';
      ctx.fillStyle=isHL?C.t1:C.t2;
      ctx.textAlign='center';
      ctx.fillText('#'+shortId(uid),x,y-r-3);
    }
    scatterHits.push({x,y,r,uid,s});
  });
}

const ALL_ITEMS=['284023','284047','284059','284535','284760','284961','285101','285102','285103','285104'];

  const cw=w-pad.l-pad.r, ch=h-pad.t-pad.b;
  const cellW=cw/ALL_ITEMS.length;

  ctx.font='10px system-ui';ctx.fillStyle=C.t3;

  heatHits=[];
  OPS.forEach(([uid,s],i)=>{
    const cy=pad.t+labelH+i*cellH;
    const isHL=selOp===uid;

    // operator label
    ctx.font=isHL?'bold 10px system-ui':'10px system-ui';
    ctx.fillStyle=isHL?C.t1:C.t2;
    ctx.textAlign='right';
    ctx.fillText('#'+shortId(uid),pad.l-4,cy+cellH/2+3.5);

    ALL_ITEMS.forEach((item,j)=>{
      const cx=pad.l+j*cellW;
      const ist=s.item_stats[item];
      const pad2=2;
      const rx=cx+pad2, ry=cy+pad2, rw=cellW-pad2*2, rh=cellH-pad2*2;

      if(!ist){
        ctx.fillStyle='rgba(210,217,232,0.3)';
        ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,3);ctx.fill();
      } else {
        const p=ist.avg_pass;
        const col=passColor(p);
        const alpha=isHL?'EE':'99';
        ctx.fillStyle=col+alpha;
        ctx.beginPath();ctx.roundRect(rx,ry,rw,rh,3);ctx.fill();
        // value text
        ctx.font=(rw>40)?'9px system-ui':'8px system-ui';
        ctx.fillStyle=isHL?'#fff':'rgba(255,255,255,0.9)';
        ctx.textAlign='center';
        ctx.fillText(p.toFixed(1),rx+rw/2,ry+rh/2+3.5);
        heatHits.push({x:rx,y:ry,w:rw,h:rh,uid,item,ist});
      }
    });
  });
}

// ── draw all ──────────────────────────────────────────────────────────────
function drawAll(){
  drawRank();
  drawScatter();
  drawHeat();
}

// ── Tooltip ───────────────────────────────────────────────────────────────
const tip=document.getElementById('tip');
function showTip(ev,html){
  tip.innerHTML=html;tip.style.display='block';
  const mx=ev.clientX+14, my=ev.clientY-8;
  tip.style.left=(mx+tip.offsetWidth>window.innerWidth?mx-tip.offsetWidth-22:mx)+'px';
  tip.style.top=(my+tip.offsetHeight>window.innerHeight?my-tip.offsetHeight:my)+'px';
}
function hideTip(){tip.style.display='none';}

function tipHtml(uid,s,extra=''){
  const col=passColor(s.avg_pass);
  return `<div class="tip-date">#${shortId(uid)}</div>
<div class="tip-row"><span>합격률 평균</span><b style="color:${col}">${s.avg_pass.toFixed(2)}%</b></div>
<div class="tip-row"><span>합격률 σ</span><b>${s.std_pass.toFixed(2)}%</b></div>
<div class="tip-row"><span>과충전율 평균</span><b>${s.avg_overfill.toFixed(2)}%</b></div>
<div class="tip-row"><span>평균 작업시간</span><b>${s.avg_work_time.toFixed(0)} min</b></div>
<div class="tip-row"><span>주문 건수</span><b>${s.order_cnt}</b></div>
${extra}`;
}

cvRank.addEventListener('mousemove',ev=>{
  const rc=cvRank.getBoundingClientRect();
  const mx=ev.clientX-rc.left, my=ev.clientY-rc.top;
  const rowH=(rc.height-12-24)/N;
  const i=Math.floor((my-12)/rowH);
  if(i<0||i>=N){hideTip();return;}
  const [uid,s]=OPS[i];
  showTip(ev,tipHtml(uid,s));
});
cvRank.addEventListener('mouseleave',hideTip);

cvScatter.addEventListener('mousemove',ev=>{
  const rc=cvScatter.getBoundingClientRect();
  const mx=ev.clientX-rc.left,my=ev.clientY-rc.top;
  let found=null;
  for(const h of scatterHits){
    if(Math.hypot(mx-h.x,my-h.y)<=h.r+4){found=h;break;}
  }
  if(!found){hideTip();return;}
  showTip(ev,tipHtml(found.uid,found.s,`<div class="tip-row"><span>제품 수</span><b>${found.s.items.length}</b></div>`));
});
cvScatter.addEventListener('mouseleave',hideTip);

cvHeat.addEventListener('mousemove',ev=>{
  const rc=cvHeat.getBoundingClientRect();
  const mx=ev.clientX-rc.left,my=ev.clientY-rc.top;
  let found=null;
  for(const h of heatHits){
    if(mx>=h.x&&mx<=h.x+h.w&&my>=h.y&&my<=h.y+h.h){found=h;break;}
  }
  if(!found){hideTip();return;}
  const col=passColor(found.ist.avg_pass);
  showTip(ev,`<div class="tip-date">#${shortId(found.uid)} × ${found.item}</div>
<div class="tip-row"><span>합격률</span><b style="color:${col}">${found.ist.avg_pass.toFixed(2)}%</b></div>
<div class="tip-row"><span>과충전율</span><b>${found.ist.avg_ovf.toFixed(2)}%</b></div>
<div class="tip-row"><span>주문 건수</span><b>${found.ist.cnt}</b></div>`);
});
cvHeat.addEventListener('mouseleave',hideTip);

// ── ResizeObserver ────────────────────────────────────────────────────────
const ro=new ResizeObserver(()=>drawAll());
ro.observe(document.getElementById('app'));
drawAll();
</script>
